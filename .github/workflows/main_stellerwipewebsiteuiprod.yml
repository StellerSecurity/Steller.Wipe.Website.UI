name: Build and deploy PHP app to Azure Web App - StellerWipeWebsiteUIProd

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wipe-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install locked PHP dependencies
        run: composer validate --no-check-publish && composer install --no-dev --prefer-dist --no-progress

      - name: Prepare deployment package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/wipe-website"
          mkdir -p "$package_dir"
          git archive HEAD -- app artisan bootstrap composer.json composer.lock config database public resources routes storage | tar -x -C "$package_dir"
          cp -a vendor "$package_dir/vendor"
          cp -a bootstrap/cache/. "$package_dir/bootstrap/cache/"
          test -f "$package_dir/public/.htaccess"
          test -f "$package_dir/vendor/autoload.php"
          test -f "$package_dir/public/js/wipe/signer.js"
          test -f "$package_dir/public/js/wipe/flow.js"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        id: deploy-to-webapp
        with:
          app-name: 'StellerWipeWebsiteUIProd'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2324422BB15849868C5E0C02DB33D41E }}
          package: ${{ runner.temp }}/wipe-website
