trigger:
- main

variables:
  azureSubscription: '9eca8d83-a0de-4a3e-b0b1-8dd4ff35cf7e'
  webAppName: 'StellerWipeWebsiteUIProd'
  vmImageName: 'ubuntu-latest'
  environmentName: 'StellerWipeWebsiteUIProd'
  rootFolder: $(System.DefaultWorkingDirectory)

stages:
- stage: Build
  displayName: Build and security validation
  variables:
    phpVersion: '8.2'
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        sudo update-alternatives --set php /usr/bin/php$(phpVersion)
        sudo update-alternatives --set phar /usr/bin/phar$(phpVersion)
        sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(phpVersion)
        sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(phpVersion)
        sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(phpVersion)
        php -version
      workingDirectory: $(rootFolder)
      displayName: Use PHP $(phpVersion)

    - script: composer validate --strict --no-check-publish
      workingDirectory: $(rootFolder)
      displayName: Validate Composer metadata and lock file

    - script: composer install --no-interaction --prefer-dist --optimize-autoloader
      workingDirectory: $(rootFolder)
      displayName: Install PHP dependencies

    - script: npm ci --no-audit --no-fund
      workingDirectory: $(rootFolder)
      displayName: Install frontend dependencies

    - script: npm run build
      workingDirectory: $(rootFolder)
      displayName: Build frontend assets

    - script: php artisan test
      workingDirectory: $(rootFolder)
      displayName: Run application tests

    - task: ArchiveFiles@2
      displayName: Archive files
      inputs:
        rootFolderOrFile: '$(rootFolder)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: Upload package
      artifact: drop

- stage: Deploy
  displayName: Deploy Web App
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: Deploy Azure Web App
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              appType: webAppLinux
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
